<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" width="100%" height="100%" fill="none">
    <defs>
        <!-- Gradients -->
        <linearGradient id="neonGold" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffe566"/>
            <stop offset="50%" stop-color="#f5c400"/>
            <stop offset="100%" stop-color="#ff6a00"/>
        </linearGradient>
        <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00eeff" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#0066ff" stop-opacity="0.1"/>
        </linearGradient>
        <linearGradient id="speedTrail" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#f5c400" stop-opacity="0"/>
            <stop offset="50%" stop-color="#ff6a00" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#f5c400" stop-opacity="1"/>
        </linearGradient>
        <linearGradient id="carBody" x1="0%" y1="0%" x2="100%" y2="50%">
            <stop offset="0%" stop-color="#2a2200"/>
            <stop offset="40%" stop-color="#f5c400"/>
            <stop offset="70%" stop-color="#ff8c00"/>
            <stop offset="100%" stop-color="#ff3300"/>
        </linearGradient>
        <linearGradient id="cockpitGlass" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00eeff" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#003366" stop-opacity="0.9"/>
        </linearGradient>
        <linearGradient id="glowG" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00eeff" stop-opacity="0"/>
            <stop offset="50%" stop-color="#00eeff" stop-opacity="0.4"/>
            <stop offset="100%" stop-color="#00eeff" stop-opacity="0"/>
        </linearGradient>

        <!-- Glow filter -->
        <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3.5" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="blur2"/>
            <feMerge>
                <feMergeNode in="blur2"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Background Speed Grid Lines -->
    <g opacity="0.25">
        <line x1="20" y1="170" x2="500" y2="170" stroke="#f5c400" stroke-width="1" stroke-dasharray="8 6"/>
        <line x1="60" y1="185" x2="500" y2="185" stroke="#00eeff" stroke-width="1.5" stroke-dasharray="16 8"/>
        <line x1="120" y1="200" x2="480" y2="200" stroke="#ff6a00" stroke-width="1" stroke-dasharray="12 10"/>
    </g>

    <!-- Speed Particle Trails Behind Car -->
    <g filter="url(#neonGlow)">
        <!-- Trail 1 -->
        <path d="M 40 105 L 280 105" stroke="url(#speedTrail)" stroke-width="3" stroke-linecap="round"/>
        <path d="M 90 92 L 310 92" stroke="url(#speedTrail)" stroke-width="2" stroke-linecap="round"/>
        <path d="M 120 120 L 290 120" stroke="url(#speedTrail)" stroke-width="2.5" stroke-linecap="round"/>
        <!-- Trail 2 (Cyan Nitro) -->
        <path d="M 70 112 L 270 112" stroke="url(#neonCyan)" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M 150 130 L 320 130" stroke="url(#neonCyan)" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Futuristic Cyberpunk Race Car -->
    <g transform="translate(190, 50)" filter="url(#neonGlow)">
        <!-- Shadow / Underglow -->
        <ellipse cx="140" cy="85" rx="130" ry="10" fill="#f5c400" opacity="0.35" filter="url(#softGlow)"/>

        <!-- Rear Wing / Spoiler -->
        <path d="M 20 40 L 45 40 L 40 58 L 22 58 Z" fill="#ff6a00"/>
        <path d="M 10 36 L 52 36 L 48 42 L 14 42 Z" fill="#ffe566" filter="url(#neonGlow)"/>
        <line x1="26" y1="42" x2="30" y2="60" stroke="#f5c400" stroke-width="2"/>

        <!-- Main Car Body Chassis -->
        <path d="M 35 62 
                 C 60 55, 95 38, 140 38 
                 C 185 38, 220 54, 255 60 
                 C 275 64, 285 70, 275 75 
                 C 260 80, 225 82, 170 82 
                 C 110 82, 50 82, 35 76 
                 C 28 72, 28 66, 35 62 Z" 
              fill="url(#carBody)" stroke="#ffe566" stroke-width="1.5"/>

        <!-- Cockpit Glass Canopy -->
        <path d="M 100 48 
                 C 120 40, 160 40, 185 48 
                 C 195 53, 190 58, 175 58 
                 L 110 58 
                 C 95 58, 92 53, 100 48 Z" 
              fill="url(#cockpitGlass)" stroke="#00eeff" stroke-width="1.2"/>
        <path d="M 125 43 L 165 43" stroke="#ffffff" stroke-width="1" opacity="0.6"/>

        <!-- Side Neon Racing Stripe -->
        <path d="M 45 68 L 245 68" stroke="#00eeff" stroke-width="2.5" stroke-linecap="round" filter="url(#neonGlow)"/>
        <path d="M 60 73 L 220 73" stroke="#ffe566" stroke-width="1" stroke-linecap="round"/>

        <!-- Front Headlight Beam -->
        <polygon points="275,68 360,60 360,78 275,74" fill="url(#glowG)"/>
        <circle cx="274" cy="71" r="3.5" fill="#ffffff" filter="url(#neonGlow)"/>

        <!-- Wheels (Front & Back) -->
        <!-- Rear Wheel -->
        <g transform="translate(68, 76)">
            <circle cx="0" cy="0" r="16" fill="#111108" stroke="#ff6a00" stroke-width="2.5"/>
            <circle cx="0" cy="0" r="9" fill="#1f1a00" stroke="#f5c400" stroke-width="1.5"/>
            <circle cx="0" cy="0" r="4" fill="#00eeff"/>
            <line x1="-12" y1="0" x2="12" y2="0" stroke="#f5c400" stroke-width="1"/>
            <line x1="0" y1="-12" x2="0" y2="12" stroke="#f5c400" stroke-width="1"/>
        </g>
        <!-- Front Wheel -->
        <g transform="translate(225, 76)">
            <circle cx="0" cy="0" r="16" fill="#111108" stroke="#ff6a00" stroke-width="2.5"/>
            <circle cx="0" cy="0" r="9" fill="#1f1a00" stroke="#f5c400" stroke-width="1.5"/>
            <circle cx="0" cy="0" r="4" fill="#00eeff"/>
            <line x1="-12" y1="0" x2="12" y2="0" stroke="#f5c400" stroke-width="1"/>
            <line x1="0" y1="-12" x2="0" y2="12" stroke="#f5c400" stroke-width="1"/>
        </g>
    </g>

    <!-- Futuristic Mechanical Keyboard Deck (Floating Underneath) -->
    <g transform="translate(30, 140)">
        <!-- Keyboard Base Plate -->
        <polygon points="10,25 440,25 425,65 25,65" fill="#16150a" stroke="url(#neonGold)" stroke-width="1.5" opacity="0.8"/>
        
        <!-- Glowing Keycap Rows (Isometric Cyberpunk Style) -->
        <!-- Row 1: Q W E R T Y U I O P -->
        <g fill="#24210e" stroke="#f5c400" stroke-width="0.8" opacity="0.9">
            <rect x="45" y="30" width="22" height="12" rx="2"/>
            <rect x="73" y="30" width="22" height="12" rx="2"/>
            <rect x="101" y="30" width="22" height="12" rx="2"/>
            <rect x="129" y="30" width="22" height="12" rx="2" fill="#f5c400" fill-opacity="0.3" stroke="#ffe566" stroke-width="1.2" filter="url(#neonGlow)"/> <!-- Active Key -->
            <rect x="157" y="30" width="22" height="12" rx="2"/>
            <rect x="185" y="30" width="22" height="12" rx="2"/>
            <rect x="213" y="30" width="22" height="12" rx="2"/>
            <rect x="241" y="30" width="22" height="12" rx="2" fill="#00eeff" fill-opacity="0.3" stroke="#00eeff" stroke-width="1.2"/>
            <rect x="269" y="30" width="22" height="12" rx="2"/>
            <rect x="297" y="30" width="22" height="12" rx="2"/>
            <rect x="325" y="30" width="22" height="12" rx="2"/>
            <rect x="353" y="30" width="22" height="12" rx="2"/>
            <rect x="381" y="30" width="30" height="12" rx="2"/>
        </g>

        <!-- Row 2: A S D F G H J K L Space -->
        <g fill="#201d0a" stroke="#ff8c00" stroke-width="0.8" opacity="0.9">
            <rect x="52" y="46" width="26" height="13" rx="2"/>
            <rect x="83" y="46" width="22" height="13" rx="2"/>
            <rect x="111" y="46" width="22" height="13" rx="2" fill="#00eeff" fill-opacity="0.35" stroke="#00eeff" stroke-width="1.2" filter="url(#neonGlow)"/> <!-- Active Key -->
            <rect x="139" y="46" width="22" height="13" rx="2"/>
            <rect x="167" y="46" width="22" height="13" rx="2"/>
            <!-- Spacebar (Long Key) -->
            <rect x="195" y="46" width="110" height="13" rx="3" fill="#f5c400" fill-opacity="0.25" stroke="#ffe566" stroke-width="1.4" filter="url(#neonGlow)"/>
            <rect x="311" y="46" width="24" height="13" rx="2"/>
            <rect x="341" y="46" width="24" height="13" rx="2"/>
            <rect x="371" y="46" width="32" height="13" rx="2"/>
        </g>
    </g>

    <!-- Floating Typing Speed Badge: "120 WPM" -->
    <g transform="translate(370, 25)" filter="url(#neonGlow)">
        <rect x="0" y="0" width="110" height="32" rx="8" fill="#111108" stroke="#00eeff" stroke-width="1.5"/>
        <circle cx="16" cy="16" r="4" fill="#a8ff3e" filter="url(#neonGlow)"/>
        <text x="30" y="21" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#00eeff" letter-spacing="1">120 WPM</text>
    </g>
</svg>
